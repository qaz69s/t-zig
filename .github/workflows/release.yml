name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils make perl autoconf automake libtool pkg-config
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: .release-build
          key: deps-${{ matrix.arch }}-zig0.14.1-ossl3.5.7-ngtcp2-1.17.0
      - name: Build
        run: bash build-release.sh ${{ matrix.arch }}
      - name: Smoke test
        if: matrix.arch == 'x86_64'
        run: |
          tar -xzf dist/tuic-zig-linux-x86_64.tar.gz -C /tmp
          /tmp/tuic-zig --version
      - uses: actions/upload-artifact@v4
        with:
          name: tuic-zig-linux-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # 同时推到 bin 分支：Release 下载节点不可用时，安装脚本改走 raw / jsDelivr
      - name: Publish to bin branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 --branch bin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bin \
            || { mkdir bin && cd bin && git init -b bin && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" && cd ..; }
          cd bin
          mkdir -p "$TAG"
          cp ../dist/* "$TAG/"
          echo "$TAG" > VERSION
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "binaries $TAG" || exit 0
          git push origin bin
