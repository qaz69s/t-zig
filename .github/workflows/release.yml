name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils make perl
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: .release-build
          key: deps-${{ matrix.arch }}-zig0.14.1-ossl3.5.7-ngtcp2-1.17.0
      - name: Build
        run: bash build-release.sh ${{ matrix.arch }}
      - name: Smoke test
        if: matrix.arch == 'x86_64'
        run: |
          tar -xzf dist/tuic-zig-linux-x86_64.tar.gz -C /tmp
          /tmp/tuic-zig --version
      - uses: actions/upload-artifact@v4
        with:
          name: tuic-zig-linux-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
